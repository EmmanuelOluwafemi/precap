<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cap Recording</title><link rel="stylesheet" href="rec.css">
<style>
body{position:relative}
#card{position:absolute;left:40px;bottom:20px;width:260px;height:150px;border-radius:12px;background:var(--g12);border:1px solid #ffffff33;overflow:hidden;box-shadow:0 8px 24px #0009;opacity:0;transform:translateY(16px);transition:opacity .3s,transform .3s}
#card.in{opacity:1;transform:none}
#th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#sh{position:absolute;inset:0;background:#00000066;opacity:0;transition:opacity .15s}
#card:hover #sh{opacity:1}
.chips{position:absolute;left:8px;bottom:8px;display:flex;gap:4px;transition:opacity .15s}
#card:hover .chips{opacity:0}
.chip{height:20px;padding:0 6px;border-radius:6px;background:#000a;color:#fff;font-size:11px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.act{position:absolute;opacity:0;transition:opacity .15s,background .15s;display:flex;align-items:center;justify-content:center;color:#fff;background:#000a}
#card:hover .act{opacity:1}
.act:hover{background:#000d}
.ic{width:28px;height:28px;border-radius:50%}
.ic svg{width:15px;height:15px}
.act.tl{left:8px;top:8px}.act.tr{right:8px;top:8px}.act.bl{left:8px;bottom:8px}.act.br{right:8px;bottom:8px}
.lb{height:28px;padding:0 10px;border-radius:14px;font-size:12px;gap:5px}
.act.ctr{left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#111;height:30px;padding:0 16px;border-radius:15px;font-size:13px}
.act.ctr:hover{background:#eee}
#prog{position:absolute;inset:0;background:#000000d9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:13px;text-align:center;padding:12px}
#prog button{color:#fff;text-decoration:underline}
#prog .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--b9);transition:width .3s}
#prog.err{color:var(--r11);font-size:12px}
#pill{position:absolute;left:50%;top:8px;transform:translateX(-50%);height:22px;padding:0 10px;border-radius:11px;background:#000c;color:#fff;font-size:11px;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:opacity .3s;pointer-events:none}
#pill svg{width:12px;height:12px}
</style></head>
<body><div id="card"></div><script src="rec.js"></script><script src="overlay.js"></script></body></html>
